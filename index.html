const { useState, useRef, useEffect } = React;

// === localStorage persistence helpers ===
function loadState(key, fallback) {
  try {
    const saved = localStorage.getItem('crt_' + key);
    return saved ? JSON.parse(saved) : fallback;
  } catch(e) { return fallback; }
}
function saveState(key, value) {
  try { localStorage.setItem('crt_' + key, JSON.stringify(value)); } catch(e) {}
}
function usePersistedState(key, fallback) {
  const [state, setState] = useState(() => loadState(key, fallback));
  useEffect(() => { saveState(key, state); }, [state]);
  return [state, setState];
}

function App() {
  const [tab, setTab] = useState("itinerary");
  const [selectedSchool, setSelectedSchool] = useState(null);
  const [ratingSchool, setRatingSchool] = useState(SCHOOLS[0].id);
  const [ratings, setRatings] = usePersistedState('ratings', {});
  const [ratingNotes, setRatingNotes] = usePersistedState('notes', {});
  const [photos, setPhotos] = useState({});
  const [photoSchool, setPhotoSchool] = useState(SCHOOLS[0].id);
  const fileRef = useRef(null);

  const setRating = (sid, qid, val) => setRatings(p => ({ ...p, [sid]: { ...(p[sid] || {}), [qid]: val } }));
  const setNote = (sid, txt) => setRatingNotes(p => ({ ...p, [sid]: txt }));
  const getAvg = (sid) => { const r = ratings[sid]; if (!r) return null; const v = Object.values(r); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1) : null; };
  const addPhoto = (sid, file) => { const r = new FileReader(); r.onload = e => setPhotos(p => ({ ...p, [sid]: [...(p[sid]||[]), { url: e.target.result, name: file.name }] })); r.readAsDataURL(file); };
  const removePhoto = (sid, idx) => setPhotos(p => ({ ...p, [sid]: p[sid].filter((_,i) => i !== idx) }));

  const S = {
    root: { fontFamily: "'DM Sans', sans-serif", background: "#0b0f14", color: "#ddd8cf", minHeight: "100vh", maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 'calc(76px + env(safe-area-inset-bottom, 0px))' },
    card: (extra) => ({ background: "#12181f", borderRadius: 14, border: "1px solid #1c2530", marginBottom: 10, ...extra }),
    muted: { color: "#5e6e80" },
    heading: { fontFamily: "'Playfair Display', serif", color: "#f0ebe3" },
  };

  return (
    <div style={S.root}>
      {/* Header */}
      <div style={{ background: "linear-gradient(160deg, #151e2a 0%, #0e1319 100%)", padding: "26px 18px 18px", borderBottom: "1px solid #1c2530" }}>
        <div style={{ ...S.heading, fontSize: 24, fontWeight: 800, letterSpacing: -0.3 }}>College Road Trip</div>
        <div style={{ fontSize: 12, color: "#6b7a8d", marginTop: 3, fontWeight: 500 }}>Apr 6–9, 2026 · Weems, VA → Clemson, SC · 6 schools · 4 days</div>
        <div style={{ display: "flex", gap: 5, marginTop: 12, flexWrap: "wrap" }}>
          {SCHOOLS.map(s => (
            <span key={s.id} style={{ fontSize: 10, padding: "3px 9px", borderRadius: 20, fontWeight: 700, letterSpacing: 0.2, background: s.color+"28", color: s.color, border: `1px solid ${s.color}44` }}>{s.shortName}</span>
          ))}
        </div>
      </div>

      {/* Content */}
      <div>
        {tab === "itinerary" && <ItineraryView S={S} />}
        {tab === "schools" && <SchoolsView S={S} selected={selectedSchool} setSelected={setSelectedSchool} />}
        {tab === "map" && <MapView S={S} />}
        {tab === "rate" && <RateView S={S} sid={ratingSchool} setSid={setRatingSchool} ratings={ratings} setRating={setRating} notes={ratingNotes} setNote={setNote} getAvg={getAvg} />}
        {tab === "photos" && <PhotosView S={S} sid={photoSchool} setSid={setPhotoSchool} photos={photos} addPhoto={addPhoto} removePhoto={removePhoto} fileRef={fileRef} />}
      </div>

      {/* Tab Bar */}
      <div className="tab-bar-ios" style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: "#0d1118", borderTop: "1px solid #1c2530", display: "flex", zIndex: 999 }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => { setTab(t.id); window.scrollTo(0,0); }} className="tap-target" style={{ flex: 1, border: "none", background: "none", padding: "10px 0 10px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, color: tab === t.id ? "#6aafed" : "#3d4d5e", transition: "color .2s", minHeight: 50, borderRadius: 0 }}>
            <span style={{ fontSize: 18 }}>{t.icon}</span>
            <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 0.6, textTransform: "uppercase" }}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

            <span style={{ flex: 1, color: "#8a96a3" }}><span style={{ fontWeight: 600, color: "#ccc6bb" }}>{s.shortName}</span> — {s.tourTime}</span>
            <a href={s.tourLink} target="_blank" rel="noreferrer" style={{ fontSize: 9, color: "#6aafed", textDecoration: "none", fontWeight: 600 }}>Link →</a>
          </div>
        ))}
        <div style={{ marginTop: 8, fontSize: 10, color: "#c8a84a", background: "#1f1a10", padding: "8px 10px", borderRadius: 8, border: "1px solid #3a2a10" }}>
          ⚠️ Clemson tours open 6 weeks in advance on Mondays at 8 AM EST!
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SCHOOLS VIEW
   ═══════════════════════════════════════════════ */
function SchoolsView({ S, selected, setSelected }) {
  const school = SCHOOLS.find(s => s.id === selected);
  if (school) return (
    <div style={{ padding: 14 }}>
      <button onClick={() => setSelected(null)} style={{ border: "none", background: "none", color: "#6aafed", fontSize: 12, cursor: "pointer", fontWeight: 600, padding: 0, marginBottom: 10 }}>← All Schools</button>
      <div style={S.card()}>
        <div style={{ background: `linear-gradient(135deg,${school.color}38,${school.color}10)`, padding: "22px 16px 16px", borderBottom: `2px solid ${school.color}55` }}>
          <div style={{ ...S.heading, fontSize: 20 }}>{school.name}</div>
          <div style={{ fontSize: 12, color: "#8a96a3", marginTop: 3 }}>{school.city} · Est. {school.founded}</div>
          <div style={{ display: "flex", gap: 5, marginTop: 8 }}>
            <span style={{ fontSize: 9, padding: "3px 9px", borderRadius: 20, fontWeight: 700, background: school.color+"28", color: school.color, border: `1px solid ${school.color}44` }}>{school.type}</span>
            <span style={{ fontSize: 9, padding: "3px 9px", borderRadius: 20, fontWeight: 600, background: "#1a2a3a", color: "#6aafed" }}>{school.ranking}</span>
          </div>
        </div>
        <div style={{ padding: "14px 16px" }}>
          <div style={{ padding: "9px 11px", background: school.color+"0e", borderRadius: 9, border: `1px solid ${school.color}1a`, marginBottom: 12, fontSize: 11, lineHeight: 1.6, color: "#b8b2a8" }}>✨ {school.highlight}</div>
          {[
            ["Enrollment", school.enrollment + " undergrad"], ["Acceptance Rate", school.acceptance],
            ["Tuition & Fees", school.tuition], ["Student:Faculty", school.ratio],
            ["Campus", school.campus], ["Known For", school.knownFor],
            ["Mascot", school.mascot], ["Athletics", school.division],
            ["Visit", `Day ${school.day} — ${school.date}`], ["Tour", school.tourType],
          ].map(([l,v], i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: i<9 ? "1px solid #161d26" : "none", fontSize: 11, gap: 10 }}>
              <span style={{ ...S.muted, fontWeight: 600, whiteSpace: "nowrap" }}>{l}</span>
              <span style={{ color: "#ddd8cf", textAlign: "right" }}>{v}</span>
            </div>
          ))}
          <a href={school.tourLink} target="_blank" rel="noreferrer" style={{ display: "block", textAlign: "center", padding: "11px", background: school.color, color: "#fff", borderRadius: 9, textDecoration: "none", fontWeight: 700, fontSize: 12, marginTop: 12 }}>Register for Tour →</a>
        </div>
      </div>
    </div>
  );
  return (
    <div style={{ padding: 14 }}>
      <div style={{ ...S.heading, fontSize: 17, marginBottom: 12 }}>School Profiles</div>
      {SCHOOLS.map(s => (
        <button key={s.id} onClick={() => setSelected(s.id)} style={{ width: "100%", border: `1px solid ${s.color}25`, background: "#12181f", borderRadius: 13, padding: "13px 14px", marginBottom: 7, cursor: "pointer", display: "flex", alignItems: "center", gap: 12, textAlign: "left" }}>
          <div style={{ width: 40, height: 40, borderRadius: 10, background: `linear-gradient(135deg,${s.color}44,${s.color}18)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: s.color, flexShrink: 0 }}>D{s.day}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#ddd8cf" }}>{s.name}</div>
            <div style={{ fontSize: 10, ...S.muted, marginTop: 2 }}>{s.city} · {s.type} · {s.acceptance} accept</div>
          </div>
          <span style={{ color: "#2a3848", fontSize: 15 }}>›</span>
        </button>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   MAP VIEW
   ═══════════════════════════════════════════════ */
function MapView({ S }) {
  const stops = [
    { name: "Weems, VA", sub: "Monday morning departure", color: "#6aafed", isStart: true },
    { name: "W&M", sub: "Williamsburg, VA", color: "#115740", day: 1, time: "10 AM tour" },
    { name: "UVA", sub: "Charlottesville, VA", color: "#232D4B", day: 1, time: "Self-guided ~2:30 PM" },
    { name: "Elon", sub: "Elon, NC", color: "#73000a", day: 2, time: "9 AM tour" },
    { name: "Burlington", sub: "Dad's hometown!", color: "#c8a84a", isExtra: true },
    { name: "UNC", sub: "Chapel Hill, NC", color: "#4B9CD3", day: 2, time: "Self-guided ~1 PM" },
    { name: "Wake Forest", sub: "Winston-Salem, NC", color: "#9E7E38", day: 3, time: "10 AM tour" },
    { name: "Easley, SC", sub: "Grandparents' house", color: "#aa7acc", isExtra: true },
    { name: "Clemson", sub: "Clemson, SC", color: "#F56600", day: 4, time: "10 AM tour" },
  ];
  const legs = [
    { dist: "62 mi", time: "1:20" },
    { dist: "121 mi", time: "2:00" },
    { dist: "180 mi", time: "3:00" },
    { dist: "5 mi", time: "0:10" },
    { dist: "30 mi", time: "0:35" },
    { dist: "80 mi", time: "1:20" },
    { dist: "190 mi", time: "3:00" },
    { dist: "10 mi", time: "0:15" },
  ];

  return (
    <div style={{ padding: 14 }}>
      <div style={{ ...S.heading, fontSize: 17, marginBottom: 12 }}>Route Overview</div>
      <div style={S.card({ padding: "18px 14px" })}>
        {stops.map((s, i) => (
          <div key={i} style={{ display: "flex", gap: 12 }}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 18 }}>
              <div style={{ width: 12, height: 12, borderRadius: 6, background: s.color, border: `3px solid ${s.color}33`, flexShrink: 0, marginTop: 2 }} />
              {i < stops.length - 1 && <div style={{ width: 2, flex: 1, background: `linear-gradient(${s.color}55,${stops[i+1]?.color||"#333"}55)`, minHeight: 34 }} />}
            </div>
            <div style={{ flex: 1, paddingBottom: i < stops.length - 1 ? 3 : 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#ddd8cf" }}>{s.name}</div>
              <div style={{ fontSize: 10, ...S.muted }}>
                {s.isStart ? s.sub : s.isExtra ? s.sub : `Day ${s.day} · ${s.time}`}
              </div>
              {i < legs.length && (
                <div style={{ fontSize: 10, color: "#3d4d5e", marginTop: 4, marginBottom: 3, padding: "3px 9px", background: "#0b1018", borderRadius: 7, display: "inline-block" }}>
                  🚗 {legs[i].dist} · {legs[i].time}

              )}

        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 7, marginTop: 4 }}>
        {[["678", "Total Miles"], ["11.5h", "Driving"], ["6", "Schools"]].map(([v,l]) => (
          <div key={l} style={S.card({ padding: "12px 8px", textAlign: "center", marginBottom: 0 })}>
            <div style={{ fontSize: 18, fontWeight: 800, color: "#6aafed", ...S.heading }}>{v}</div>
            <div style={{ fontSize: 9, color: "#3d4d5e", fontWeight: 700, marginTop: 2, textTransform: "uppercase", letterSpacing: 0.5 }}>{l}</div>
          </div>
        ))}
      </div>
      <div style={S.card({ padding: "12px 14px", marginTop: 7 })}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#c8a84a", marginBottom: 6 }}>🍽️ Dining Tips</div>
        {[["The Corner", "UVA, Charlottesville"], ["Franklin Street", "UNC, Chapel Hill"], ["Downtown W-S", "Wake Forest, Winston-Salem"]].map(([n,d],i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 11, borderBottom: i<2 ? "1px solid #161d26" : "none" }}>
            <span style={{ color: "#b8b2a8", fontWeight: 500 }}>{n}</span><span style={S.muted}>{d}</span>
          </div>
        ))}
      </div>
      <div style={S.card({ padding: "12px 14px", marginTop: 0 })}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#6aafed", marginBottom: 6 }}>🎒 Packing Reminders</div>
        {["Comfortable shoes (3–5 mi walking/day)", "Phone charger / portable battery", "Water bottles", "Notebook for questions & impressions", "Flowbird app (Clemson parking)"].map((t,i) => (
          <div key={i} style={{ fontSize: 11, padding: "4px 0", color: "#8a96a3", borderBottom: i<4 ? "1px solid #161d26" : "none" }}>• {t}</div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   RATE VIEW
   ═══════════════════════════════════════════════ */
function RateView({ S, sid, setSid, ratings, setRating, notes, setNote, getAvg }) {
  const s = SCHOOLS.find(x => x.id === sid);
  const sr = ratings[sid] || {};
  const ct = Object.keys(sr).length;

  return (
    <div style={{ padding: 14 }}>
      <div style={{ ...S.heading, fontSize: 17, marginBottom: 3 }}>Rate Each School</div>
      <div style={{ fontSize: 11, ...S.muted, marginBottom: 12 }}>Tap stars after each visit. Compare at the end!</div>
      
      <div className="scroll-row" style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 8, marginBottom: 8 }}>
        {SCHOOLS.map(x => {
          const a = sid === x.id; const av = getAvg(x.id);
          return <button key={x.id} onClick={() => setSid(x.id)} style={{ flexShrink: 0, border: a ? `2px solid ${x.color}` : "1px solid #1c2530", background: a ? x.color+"1a" : "#12181f", borderRadius: 10, padding: "7px 11px", cursor: "pointer", textAlign: "center", minWidth: 56 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: a ? x.color : "#5e6e80" }}>{x.shortName}</div>
            {av && <div style={{ fontSize: 9, color: "#3d4d5e", marginTop: 1 }}>{av} ★</div>}
          </button>;
        })}
      </div>

      <div style={S.card({ padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" })}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700 }}>{s.name}</div>
          <div style={{ fontSize: 10, ...S.muted }}>{ct}/10 rated{getAvg(sid) ? ` · Avg: ${getAvg(sid)} ★` : ""}</div>
        </div>
        <div style={{ width: 36, height: 36, borderRadius: 18, background: `conic-gradient(${s.color} ${ct*36}deg,#1c2530 0deg)`, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ width: 26, height: 26, borderRadius: 13, background: "#12181f", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: s.color }}>{ct}</div>
        </div>
      </div>

      {RATING_QUESTIONS.map(q => (
        <div key={q.id} style={S.card({ padding: "11px 12px", border: sr[q.id] ? `1px solid ${s.color}28` : "1px solid #1c2530" })}>
          <div style={{ fontSize: 11, fontWeight: 600, color: "#8a96a3", marginBottom: 1 }}>{q.id}. {q.label}</div>
          <div style={{ fontSize: 10, ...S.muted, marginBottom: 7 }}>{q.q}</div>
          <div style={{ display: "flex", gap: 4 }}>
            {[1,2,3,4,5].map(v => (
              <button key={v} onClick={() => setRating(sid, q.id, v)} className="tap-target" style={{ width: 44, height: 44, borderRadius: 10, border: "none", cursor: "pointer", background: sr[q.id] >= v ? s.color : "#161d26", color: sr[q.id] >= v ? "#fff" : "#3d4d5e", fontSize: 18, fontWeight: 600, transition: "all .15s", display: "flex", alignItems: "center", justifyContent: "center" }}>★</button>
            ))}
            <span style={{ fontSize: 10, color: "#3d4d5e", alignSelf: "center", marginLeft: 4 }}>{sr[q.id] || "—"}/5</span>
          </div>
        </div>
      ))}

      <div style={S.card({ padding: "11px 12px" })}>
        <div style={{ fontSize: 11, fontWeight: 600, color: "#8a96a3", marginBottom: 5 }}>📝 Notes about {s.shortName}</div>
        <textarea value={notes[sid]||""} onChange={e=>setNote(sid,e.target.value)} placeholder="Likes, dislikes, random thoughts..." style={{ width: "100%", minHeight: 80, background: "#0b1018", color: "#ddd8cf", border: "1px solid #1c2530", borderRadius: 7, padding: "10px", fontSize: 16, resize: "vertical", fontFamily: "'DM Sans',sans-serif", boxSizing: "border-box" }} />
      </div>

      {Object.keys(ratings).length > 1 && (
        <div style={S.card({ padding: "12px 14px" })}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#6aafed", marginBottom: 8 }}>📊 Comparison</div>
          {SCHOOLS.filter(x => getAvg(x.id)).sort((a,b) => parseFloat(getAvg(b.id)) - parseFloat(getAvg(a.id))).map((x,i) => {
            const av = parseFloat(getAvg(x.id));
            return <div key={x.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
              <span style={{ fontSize: 10, fontWeight: 800, color: i===0 ? "#c8a84a" : "#3d4d5e", width: 14, textAlign: "right" }}>{i+1}</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: "#ddd8cf", width: 55 }}>{x.shortName}</span>
              <div style={{ flex: 1, height: 7, background: "#0b1018", borderRadius: 4, overflow: "hidden" }}>
                <div style={{ width: `${av*20}%`, height: "100%", background: x.color, borderRadius: 4, transition: "width .4s" }} />
              </div>
              <span style={{ fontSize: 11, fontWeight: 800, color: x.color, width: 26, textAlign: "right" }}>{av}</span>
            </div>;
          })}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   PHOTOS VIEW
   ═══════════════════════════════════════════════ */
function PhotosView({ S, sid, setSid, photos, addPhoto, removePhoto, fileRef }) {
  const s = SCHOOLS.find(x => x.id === sid);
  const sp = photos[sid] || [];
  const total = Object.values(photos).reduce((a,b)=>a+b.length,0);

  return (
    <div style={{ padding: 14 }}>
      <div style={{ ...S.heading, fontSize: 17, marginBottom: 3 }}>Photo Collector</div>
      <div style={{ fontSize: 11, ...S.muted, marginBottom: 12 }}>{total} photo{total!==1?"s":""} collected</div>
      
      <div className="scroll-row" style={{ display: "flex", gap: 5, overflowX: "auto", paddingBottom: 8, marginBottom: 8 }}>
        {SCHOOLS.map(x => {
          const c = (photos[x.id]||[]).length; const a = sid === x.id;
          return <button key={x.id} onClick={() => setSid(x.id)} style={{ flexShrink: 0, border: a ? `2px solid ${x.color}` : "1px solid #1c2530", background: a ? x.color+"1a" : "#12181f", borderRadius: 10, padding: "7px 11px", cursor: "pointer", textAlign: "center", minWidth: 56 }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: a ? x.color : "#5e6e80" }}>{x.shortName}</div>
            {c>0 && <div style={{ fontSize: 9, color: "#3d4d5e", marginTop: 1 }}>{c} 📸</div>}
          </button>;
        })}
      </div>

      <input ref={fileRef} type="file" accept="image/*" capture="environment" multiple style={{ display: "none" }} onChange={e => { Array.from(e.target.files).forEach(f => addPhoto(sid, f)); e.target.value = ""; }} />
      <button onClick={() => fileRef.current?.click()} style={{ width: "100%", padding: "14px", background: `linear-gradient(135deg,${s.color}18,${s.color}0a)`, border: `2px dashed ${s.color}44`, borderRadius: 12, cursor: "pointer", color: s.color, fontSize: 13, fontWeight: 600, marginBottom: 12 }}>
        📸 Add Photos for {s.shortName}
      </button>

      {sp.length === 0 ? (
        <div style={{ textAlign: "center", padding: "36px 16px", color: "#2a3848" }}>
          <div style={{ fontSize: 36, marginBottom: 6 }}>📷</div>
          <div style={{ fontSize: 12 }}>No photos yet for {s.shortName}</div>
          <div style={{ fontSize: 10, marginTop: 3, color: "#1c2530" }}>Tap above to add photos from your visit</div>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
          {sp.map((p,i) => (
            <div key={i} style={{ position: "relative", borderRadius: 10, overflow: "hidden", aspectRatio: "1", background: "#161d26" }}>
              <img src={p.url} alt={p.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
              <button onClick={() => removePhoto(sid, i)} style={{ position: "absolute", top: 5, right: 5, width: 22, height: 22, borderRadius: 11, background: "rgba(0,0,0,.7)", border: "none", color: "#f66", cursor: "pointer", fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
